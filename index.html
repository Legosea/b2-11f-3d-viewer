<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>11F B2｜室內展示（v4 空模校對版）</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#4f4337}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#ece8e3 0%,#ddd8d2 100%)}
#app{position:fixed;inset:0} canvas{display:block}
.toolbar{position:absolute;left:18px;top:18px;display:flex;gap:8px;flex-wrap:wrap;z-index:3}
.pill{background:rgba(255,255,255,.88);border:1px solid rgba(92,76,58,.12);box-shadow:0 10px 28px rgba(60,44,28,.10);backdrop-filter:blur(12px);border-radius:999px;padding:6px;display:flex;gap:4px;align-items:center}
button{appearance:none;border:0;border-radius:999px;background:transparent;color:#5a4d3f;padding:10px 14px;font-size:13px;font-weight:650;cursor:pointer;transition:all .18s ease}
button:hover,button.active{background:#e8d8c4;color:#40352a}
.title{padding:0 14px 0 7px;font-size:13px;font-weight:700;white-space:nowrap}.dot{width:9px;height:9px;border-radius:50%;background:#b89263;margin-left:7px}
.note{position:absolute;right:18px;bottom:18px;background:rgba(255,255,255,.86);border:1px solid rgba(92,76,58,.12);border-radius:14px;padding:11px 14px;font-size:11px;color:#6d6155;box-shadow:0 8px 24px rgba(60,44,28,.08);z-index:2;max-width:340px;line-height:1.55}
.credit{position:absolute;left:18px;bottom:18px;background:rgba(255,255,255,.82);border:1px solid rgba(92,76,58,.10);border-radius:12px;padding:8px 10px;font-size:11px;color:#776b60;z-index:2}
@media(max-width:900px){.note{display:none}.title{display:none}.credit{display:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="app"></div>
<div class="toolbar">
  <div class="pill"><span class="dot"></span><span class="title">11F B2 室內展示</span></div>
  <div class="pill">
    <button id="iso" class="active">鳥瞰</button>
    <button id="topBtn">平面</button>
    <button id="entryBtn">入口</button>
  </div>
</div>
<div class="note">左鍵旋轉 · 滾輪縮放 · 右鍵平移<br>本版重點：先校正平面與牆位，不再沿用錯誤的三房配置。<br>樓高 3300 mm ｜ W3 2680×1900 mm ｜ 窗台 500 mm</div>
<div class="credit">v4：依最新 PDF 平面圖重建空模型（GitHub Pages）</div>
<script>
const app=document.getElementById('app');
if(!window.THREE){
  app.innerHTML='<div style="padding:32px;font-family:sans-serif">Three.js 載入失敗，請確認有網路後重新整理。</div>';
  throw new Error('Three.js unavailable');
}
const PLAN_W=11.64, PLAN_H=6.99, FLOOR_H=3.3;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.82;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
let aspect=innerWidth/innerHeight;
const frustum=7.1;
const camera=new THREE.OrthographicCamera(-frustum*aspect,frustum*aspect,frustum,-frustum,0.1,100);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=0.08;
controls.screenSpacePanning=true;
controls.minZoom=0.75;
controls.maxZoom=2.5;
controls.minPolarAngle=Math.PI*0.14;
controls.maxPolarAngle=Math.PI*0.47;

scene.add(new THREE.AmbientLight(0xf7f2ea,0.55));
scene.add(new THREE.HemisphereLight(0xfffaf3,0xd9d1c6,0.54));
const sun=new THREE.DirectionalLight(0xfff3e4,0.95);
sun.position.set(-5.5,10,7.5);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-15; sun.shadow.camera.right=15; sun.shadow.camera.top=12; sun.shadow.camera.bottom=-12; sun.shadow.camera.near=0.5; sun.shadow.camera.far=35; sun.shadow.bias=-0.0005;
scene.add(sun);
const fill=new THREE.DirectionalLight(0xf0f4ff,0.18); fill.position.set(10,7,-4); scene.add(fill);

function std(color, rough=0.8, metal=0){ return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal}); }
const wallOuterMat=std(0xe5dfd7,0.94), wallInnerMat=std(0xf2ede6,0.95), cutMat=std(0xddc6ab,0.84);
const slabMat=std(0xe0dad2,0.95), slabEdgeMat=std(0xcfc6bb,0.95), glassMat=new THREE.MeshPhysicalMaterial({color:0xcfdde3,roughness:0.05,transparent:true,opacity:0.32,transmission:0.25});
const frameMat=std(0x83878c,0.45,0.18), woodMat=std(0x9c7b59,0.72), porcelainMat=std(0xf6f4f0,0.94);

function makeWoodTexture(){
  const c=document.createElement('canvas'); c.width=1024; c.height=1024; const g=c.getContext('2d');
  g.fillStyle='#e4cfb0'; g.fillRect(0,0,1024,1024);
  for(let i=0;i<44;i++){
    const y=i*24; const h=22;
    g.fillStyle=(i%2)?'#ead7bb':'#dfc7a3'; g.fillRect(0,y,1024,h);
    g.strokeStyle='rgba(120,85,48,.08)'; g.lineWidth=2; g.beginPath(); g.moveTo(0,y+3); g.lineTo(1024,y+3); g.stroke();
    for(let k=0;k<22;k++){
      g.strokeStyle='rgba(145,105,65,.08)'; g.beginPath();
      let x=Math.random()*1024; g.moveTo(x,y+2); g.quadraticCurveTo(x+16,y+10,x+4,y+20); g.stroke();
    }
  }
  const tex=new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(2.3,1.8); tex.encoding=THREE.sRGBEncoding; return tex;
}
const floorMat=new THREE.MeshStandardMaterial({map:makeWoodTexture(),roughness:0.95});

function add(mesh,x,y,z,rx=0,ry=0,rz=0,parent=scene,cast=true,receive=true){ mesh.position.set(x,y,z); mesh.rotation.set(rx,ry,rz); mesh.castShadow=cast; mesh.receiveShadow=receive; parent.add(mesh); return mesh; }
function box(w,h,d,mat,x,y,z,ry=0,parent=scene,cast=true,receive=true){ return add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat),x,y,z,0,ry,0,parent,cast,receive); }
function cyl(rt,rb,h,mat,x,y,z,parent=scene){ return add(new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,24),mat),x,y,z,0,0,0,parent); }
function planeShadow(w,d,x,z,opacity=0.08){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.ShadowMaterial({opacity})); m.rotation.x=-Math.PI/2; m.position.set(x,0.021,z); m.receiveShadow=true; scene.add(m); }

function wallSeg(x0,z0,x1,z1,th=0.12,h=FLOOR_H,mat=wallInnerMat){
  const dx=x1-x0, dz=z1-z0; const len=Math.hypot(dx,dz); const cx=(x0+x1)/2, cz=(z0+z1)/2; const ang=Math.atan2(dz,dx);
  return box(len,h,th,mat,cx,h/2,cz,-ang);
}
function outerWall(x0,z0,x1,z1,th=0.16,h=FLOOR_H){ return wallSeg(x0,z0,x1,z1,th,h,wallOuterMat); }
function innerWall(x0,z0,x1,z1,th=0.12,h=FLOOR_H){ return wallSeg(x0,z0,x1,z1,th,h,wallInnerMat); }
function cutWall(x0,z0,x1,z1,th=0.16,h=FLOOR_H){ return wallSeg(x0,z0,x1,z1,th,h,cutMat); }
function floorRect(x,z,w,d,mat=floorMat,y=0.03){ return box(w,0.06,d,mat,x+w/2,y,z+d/2); }
function slabRect(x,z,w,d,y=0.0,h=0.14){ box(w,h,d,slabMat,x+w/2,y+h/2,z+d/2); }

const base=new THREE.Group(); scene.add(base);
slabRect(-0.35,-0.35,PLAN_W+0.70,PLAN_H+0.80,0,0.18);
box(PLAN_W+0.75,0.08,PLAN_H+0.85,slabEdgeMat,PLAN_W/2,0.04,PLAN_H/2);
planeShadow(PLAN_W+1.6,PLAN_H+1.4,PLAN_W/2,PLAN_H/2,0.11);

floorRect(0.00,0.00,3.05,1.85,std(0xd9d8d5,0.98));
floorRect(0.00,1.85,3.05,3.40);
floorRect(3.05,0.00,5.20,4.95);
floorRect(8.25,0.00,3.39,4.55);
floorRect(6.45,4.58,3.05,1.10,std(0xd8d3cb,0.98));
floorRect(9.55,4.18,2.09,1.50,std(0xded9d2,0.98));
floorRect(3.05,4.95,3.40,0.30,std(0xefeae1,0.98));

outerWall(0.00,0.00,3.55,0.00);
outerWall(4.55,0.00,11.64,0.00);
outerWall(0.00,0.00,0.00,6.35);
outerWall(11.64,0.00,11.64,5.68);
cutWall(0.00,6.35,1.10,6.35,0.16,0.95);
cutWall(10.80,5.68,11.64,5.68,0.16,0.95);

outerWall(3.05,0.00,3.05,1.85);
innerWall(0.00,1.85,2.20,1.85);
innerWall(2.78,1.85,3.05,1.85);
innerWall(1.00,0.00,1.00,1.82,0.09,2.45);
innerWall(2.12,0.00,2.12,0.88,0.09,2.20);
innerWall(2.12,1.44,2.12,1.85,0.09,2.20);

(function(){
  const shower=new THREE.Group(); scene.add(shower);
  box(0.82,0.02,0.82,std(0xf2f2ef,1),0.50,0.035,0.93,0,shower,false,true);
  add(new THREE.Mesh(new THREE.BoxGeometry(0.82,1.95,0.02),glassMat),0.50,1.02,0.53,0,0,0,shower,false,false);
  add(new THREE.Mesh(new THREE.BoxGeometry(0.02,1.95,0.82),glassMat),0.90,1.02,0.93,0,0,0,shower,false,false);
  cyl(0.23,0.19,0.35,porcelainMat,1.62,0.42,0.63); box(0.42,0.48,0.20,porcelainMat,1.62,0.60,0.30);
  box(0.72,0.48,0.44,woodMat,2.55,0.36,0.42); box(0.76,0.06,0.48,porcelainMat,2.55,0.64,0.42); cyl(0.14,0.14,0.04,std(0xe8e6e1,0.98),2.55,0.67,0.42);
})();

innerWall(0.00,1.85,2.35,1.85);
innerWall(2.40,3.05,3.05,3.05);
innerWall(3.05,3.05,3.05,5.25);
box(2.10,0.10,0.60,std(0xddd6cd,0.98),1.55,0.08,5.55,0,scene,false,true);

outerWall(8.25,0.00,8.25,4.55);
innerWall(6.45,4.58,6.45,5.68);
innerWall(6.45,4.58,9.50,4.58);
innerWall(9.50,4.58,9.50,5.68);
innerWall(8.25,4.55,9.55,4.55);

innerWall(9.55,4.18,9.55,5.68);
innerWall(9.55,4.18,11.64,4.18);
box(0.35,1.40,0.70,std(0xddd7ce,0.92),9.33,0.70,5.00);
innerWall(9.20,4.58,9.20,5.45,0.08,1.7);
innerWall(9.52,4.58,9.52,5.45,0.08,1.7);
innerWall(9.20,4.58,9.52,4.58,0.08,1.7);
innerWall(9.20,5.45,9.52,5.45,0.08,1.7);
box(0.70,0.48,0.42,woodMat,10.95,0.36,4.48); box(0.74,0.06,0.46,porcelainMat,10.95,0.64,4.48); cyl(0.14,0.14,0.04,std(0xe8e6e1,0.98),10.95,0.67,4.48);
cyl(0.23,0.19,0.35,porcelainMat,10.68,0.42,5.20); box(0.42,0.48,0.20,porcelainMat,11.02,0.60,5.20,Math.PI/2);

(function(){
  const grp=new THREE.Group();
  const cx=4.76, z=6.07, width=2.68, height=1.90, sill=0.50;
  function fbox(w,h,d,x,y,z){ return box(w,h,d,frameMat,x,y,z,0,grp,false,false); }
  fbox(width,0.045,0.045,0,sill+0.025,0); fbox(width,0.045,0.045,0,sill+height-0.025,0);
  fbox(0.045,height,0.045,-width/2+0.022,sill+height/2,0); fbox(0.045,height,0.045,width/2-0.022,sill+height/2,0);
  const mull1=-width/2+0.79, mull2=mull1+1.10; fbox(0.04,height,0.04,mull1,sill+height/2,0); fbox(0.04,height,0.04,mull2,sill+height/2,0);
  fbox(width,0.04,0.04,0,sill+0.80,0);
  const glass=new THREE.Mesh(new THREE.BoxGeometry(width-0.10,height-0.08,0.02),glassMat); glass.position.set(0,sill+height/2,0); glass.castShadow=false; grp.add(glass);
  grp.position.set(cx,0,z); scene.add(grp);
})();

(function(){
  const grp=new THREE.Group();
  const width=1.25, height=2.0, sill=0.12, cx=1.55, z=5.56;
  function f(w,h,d,x,y,z){ return box(w,h,d,frameMat,x,y,z,0,grp,false,false); }
  f(width,0.035,0.035,0,sill+height-0.02,0); f(0.035,height,0.035,-width/2+0.017,sill+height/2,0); f(0.035,height,0.035,width/2-0.017,sill+height/2,0);
  const glass=new THREE.Mesh(new THREE.BoxGeometry(width-0.08,height-0.08,0.018),glassMat); glass.position.set(0,sill+height/2,0); glass.castShadow=false; grp.add(glass);
  grp.position.set(cx,0,z); scene.add(grp);
})();

function doorLeaf(cx,cz,w=0.85,h=2.2,ang=0,pivot='left'){
  const g=new THREE.Group();
  const leaf=box(w,h,0.035,std(0xc89f75,0.82),0,h/2,0,0,g);
  if(pivot==='left') leaf.position.x=w/2; else leaf.position.x=-w/2;
  g.position.set(cx,0,cz);
  g.rotation.y=ang;
  scene.add(g);
  return g;
}
doorLeaf(3.72,0.08,0.96,2.2,-Math.PI/2,'left');
const leftBathDoor=doorLeaf(2.26,1.88,0.78,2.2,Math.PI,'left'); leftBathDoor.position.z=1.88;
doorLeaf(2.22,1.96,0.90,2.2,Math.PI/2,'left');
doorLeaf(8.33,0.72,0.86,2.2,0,'left');
doorLeaf(6.62,4.62,0.88,2.2,0,'left');
doorLeaf(9.72,4.22,0.82,2.2,0,'left');

function label(text,x,z){
  const c=document.createElement('canvas'); c.width=256; c.height=80; const g=c.getContext('2d');
  g.font='bold 28px Noto Sans TC, sans-serif'; g.fillStyle='rgba(88,73,58,.70)'; g.textAlign='center'; g.fillText(text,128,48);
  const tex=new THREE.CanvasTexture(c); tex.encoding=THREE.sRGBEncoding;
  const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false});
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(1.28,0.40),mat); mesh.rotation.x=-Math.PI/2; mesh.position.set(x,0.031,z); scene.add(mesh);
}
label('開放空間',5.55,2.55); label('左房',1.45,3.62); label('右房',9.95,2.12); label('陽台',7.98,5.12);

function setActive(id){ ['iso','topBtn','entryBtn'].forEach(k=>document.getElementById(k).classList.toggle('active',k===id)); }
function viewIso(){ camera.position.set(12.3,9.3,9.9); camera.zoom=1.28; controls.target.set(5.75,0.84,3.55); camera.updateProjectionMatrix(); controls.update(); setActive('iso'); }
function viewTop(){ camera.position.set(5.82,18.0,3.48); camera.zoom=1.20; controls.target.set(5.82,0,3.48); camera.updateProjectionMatrix(); controls.update(); setActive('topBtn'); }
function viewEntry(){ camera.position.set(7.1,5.4,9.8); camera.zoom=1.38; controls.target.set(5.9,1.05,2.1); camera.updateProjectionMatrix(); controls.update(); setActive('entryBtn'); }

document.getElementById('iso').onclick=viewIso;
document.getElementById('topBtn').onclick=viewTop;
document.getElementById('entryBtn').onclick=viewEntry;

window.addEventListener('resize',()=>{
  aspect=innerWidth/innerHeight;
  camera.left=-frustum*aspect; camera.right=frustum*aspect; camera.top=frustum; camera.bottom=-frustum;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);
});

viewIso();
function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
animate();
</script>
</body>
</html>
