name: v5 CI
on:
  push:
    branches: [feature/b2-v5-native]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FULL_QA: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'qa:') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Skill self-tests
        run: node vendor/interior-design-master/scripts/test-scripts.mjs
      - name: Validate case
        run: node vendor/interior-design-master/scripts/validate-case.mjs case --strict
      - name: Check product evidence links
        if: env.FULL_QA == 'true'
        run: node vendor/interior-design-master/scripts/check-product-links.mjs case
      - name: Install viewer
        run: npm ci
        working-directory: viewer
      - name: Link case
        run: npm run link-case -- ../case
        working-directory: viewer
      - name: Data regression tests
        run: node --test tests/*.test.mjs
        working-directory: viewer
      - name: Build viewer
        run: npm run build
        working-directory: viewer
      - name: Install Chromium
        if: env.FULL_QA == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: viewer
      - name: Browser smoke
        if: env.FULL_QA == 'true'
        run: |
          for attempt in 1 2 3; do
            echo "Browser smoke attempt $attempt/3"
            if npm run smoke -- --no-build; then
              exit 0
            fi
            rm -rf output/smoke
            sleep 3
          done
          exit 1
        working-directory: viewer
      - name: Hero luminance guard
        if: env.FULL_QA == 'true'
        run: node scripts/check-hero-luminance.mjs output/smoke/desktop-axon.png
        working-directory: viewer
      - name: Upload smoke evidence
        if: always() && env.FULL_QA == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: b2-v5-smoke-${{ github.sha }}
          path: viewer/output/smoke/
          if-no-files-found: warn
