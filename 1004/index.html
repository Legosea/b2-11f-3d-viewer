<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f3ed" />
  <title>1004 Empty Interior · Three.js</title>
  <link rel="stylesheet" href="./styles.css?v=20261004-woodgrain-threeviews-v2" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.183.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.183.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <input id="fileInput" type="file" accept=".skp" hidden />
  <button id="exportBtn" hidden disabled></button>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>1004 · Empty Interior 3D</h1>
        <p>室內配置 · 木紋材質 + 三視圖 + 元件庫</p>
      </div>
      <div class="actions">
        <button id="fitBtn" class="button" disabled>置中</button>
        <div class="view-group" aria-label="三視圖">
          <button id="topViewBtn" class="button view-button">俯視</button>
          <button id="frontViewBtn" class="button view-button">正視</button>
          <button id="sideViewBtn" class="button view-button">側視</button>
        </div>
        <button id="libraryBtn" class="button primary">元件庫</button>
      </div>
    </header>

    <main class="viewer">
      <div id="viewport"></div>

      <div id="objectToolbar" class="object-toolbar hidden">
        <span>可編輯元件 · 角度磁吸</span>
        <button id="moveObjectBtn" class="button active">移動</button>
        <button id="rotateObjectBtn" class="button">旋轉</button>
        <button id="deleteObjectBtn" class="button danger">刪除</button>
      </div>

      <div id="libraryBackdrop" class="library-backdrop hidden"></div>

      <aside id="componentLibrary" class="component-library hidden">
        <div class="library-header">
          <div>
            <strong>室內元件庫</strong>
            <small>家電、家具與材質</small>
          </div>
          <button id="closeLibraryBtn" class="library-close" aria-label="關閉">×</button>
        </div>

        <div class="library-tabs">
          <button class="library-tab active" data-library-tab="appliances">家電</button>
          <button class="library-tab" data-library-tab="furniture">家具</button>
          <button class="library-tab" data-library-tab="materials">材質</button>
        </div>

        <section class="library-section" data-library-section="appliances">
          <article class="catalog-card">
            <div class="catalog-product">
              <div class="catalog-icon washer-icon">
                <span></span>
              </div>
              <div>
                <strong>Panasonic NA-V170RPH</strong>
                <small>640 × 773 × 1035 mm</small>
              </div>
            </div>

            <div class="library-label">顏色</div>
            <div class="swatch-row">
              <button class="swatch-option" data-washer-variant="black">
                <span class="swatch" style="--swatch:#171819"></span>
                夜幕黑
              </button>
              <button class="swatch-option" data-washer-variant="white">
                <span class="swatch" style="--swatch:#e9e9e5"></span>
                冰鑽白
              </button>
            </div>

            <button id="addWasherBtn" class="button primary catalog-action">放置 / 選取</button>
          </article>
        </section>

        <section class="library-section hidden" data-library-section="furniture">
          <div class="library-empty">
            <strong>家具元件庫</strong>
            <p>後續加入沙發、床、餐桌、櫃體時，會共用目前的移動、旋轉磁吸、刪除與記憶機制。</p>
          </div>
        </section>

        <section class="library-section hidden" data-library-section="materials">
          <div class="material-group">
            <div class="library-label">木地板</div>
            <div class="swatch-grid">
              <button class="material-swatch" data-material-scope="floor" data-material-preset="light-oak">
                <span class="swatch" style="--swatch:#f0d8ad"></span><span>淺橡木</span>
              </button>
              <button class="material-swatch" data-material-scope="floor" data-material-preset="natural-oak">
                <span class="swatch" style="--swatch:#d1ae7b"></span><span>自然橡木</span>
              </button>
              <button class="material-swatch" data-material-scope="floor" data-material-preset="warm-oak">
                <span class="swatch" style="--swatch:#b98554"></span><span>暖橡木</span>
              </button>
              <button class="material-swatch" data-material-scope="floor" data-material-preset="walnut">
                <span class="swatch" style="--swatch:#76513a"></span><span>胡桃木</span>
              </button>
            </div>
          </div>

          <div class="material-group">
            <div class="library-label">房間門片</div>
            <div class="swatch-grid">
              <button class="material-swatch" data-material-scope="roomDoor" data-material-preset="matte-white">
                <span class="swatch" style="--swatch:#e8e3db"></span><span>霧白</span>
              </button>
              <button class="material-swatch" data-material-scope="roomDoor" data-material-preset="light-oak">
                <span class="swatch" style="--swatch:#d5b17d"></span><span>淺橡木</span>
              </button>
              <button class="material-swatch" data-material-scope="roomDoor" data-material-preset="natural-wood">
                <span class="swatch" style="--swatch:#b78353"></span><span>自然木</span>
              </button>
              <button class="material-swatch" data-material-scope="roomDoor" data-material-preset="walnut">
                <span class="swatch" style="--swatch:#6d4937"></span><span>胡桃木</span>
              </button>
              <button class="material-swatch" data-material-scope="roomDoor" data-material-preset="warm-gray">
                <span class="swatch" style="--swatch:#91897f"></span><span>暖灰</span>
              </button>
            </div>
          </div>
        </section>
      </aside>

      <input id="welcomeFileInput" type="file" accept=".skp" hidden />
      <section id="welcome" class="welcome hidden"></section>

      <section id="loading" class="loading hidden">
        <div class="spinner"></div>
        <div id="loadingTitle">解析模型中…</div>
        <div id="loadingDetail">大型模型需要較多記憶體，建議使用桌面版 Chrome / Edge。</div>
      </section>

      <div class="hud">
        <span id="modeBadge">尚未載入</span>
        <span id="modelInfo"></span>
      </div>
    </main>

    <footer class="statusbar">
      <span id="status">1004 · 空屋擬真 · 西北向午後日照</span>
      <span>Three.js · Photoreal Daylight</span>
    </footer>
  </div>

  <script type="module" src="./app.js?v=20261004-woodgrain-threeviews-v2"></script>
</body>
</html>
