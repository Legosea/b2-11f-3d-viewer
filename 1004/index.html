<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f3ed" />
  <title>1004 Nordic Interior · Three.js</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.183.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.183.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>1004 · Nordic Interior 3D</h1>
        <p>北歐 / Japandi 即時互動室內模型</p>
      </div>
      <div class="actions">
        <label class="button primary">
          更換 SKP
          <input id="fileInput" type="file" accept=".skp" hidden />
        </label>
        <button id="fitBtn" class="button" disabled>置中</button>
        <button id="exportBtn" class="button" disabled>下載 GLB</button>
      </div>
    </header>

    <main class="viewer">
      <div id="viewport"></div>

      <section id="welcome" class="welcome">
        <div class="drop-card">
          <div class="icon">3D</div>
          <h2>拖曳或選擇 1004.skp</h2>
          <p>你的 SKP 約 96 MB，系統會優先使用 WASM 快速模式，避免純 JavaScript 解析耗盡瀏覽器記憶體。</p>
          <label class="button primary big">
            選擇 SketchUp 檔案
            <input id="welcomeFileInput" type="file" accept=".skp" hidden />
          </label>
          <small>檔案只在你的瀏覽器中處理，不會上傳到本頁的伺服器。</small>
        </div>
      </section>

      <section id="loading" class="loading hidden">
        <div class="spinner"></div>
        <div id="loadingTitle">解析模型中…</div>
        <div id="loadingDetail">大型模型需要較多記憶體，建議使用桌面版 Chrome / Edge。</div>
      </section>

      <div class="hud">
        <span id="modeBadge">尚未載入</span>
        <span id="modelInfo"></span>
      </div>
    </main>

    <footer class="statusbar">
      <span id="status">1004 · 北歐 / Japandi 即時 3D</span>
      <span>Three.js · Isometric Interior</span>
    </footer>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
